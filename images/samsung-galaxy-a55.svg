    <rect x="239" y="111" width="330" height="573" rx="54" fill="url(#edge)" stroke="#21334a" stroke-width="8"/>
    <rect x="249" y="122" width="310" height="550" rx="45" fill="url(#phone)"/>
    <path d="M253 171q0-44 44-44h183q-127 90-231 240z" fill="#ffffff" opacity=".12"/>
    <g fill="#172533" stroke="#c5d0d5" stroke-width="5">
      <circle cx="305" cy="196" r="34"/>
