      <circle cx="305" cy="366" r="34"/>
    </g>
    <g fill="#0c1723">
      <circle cx="305" cy="196" r="23"/>
      <circle cx="305" cy="281" r="23"/>
      <circle cx="305" cy="366" r="23"/>
    </g>
