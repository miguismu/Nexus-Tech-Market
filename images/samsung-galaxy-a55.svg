<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">Ilustración del Samsung Galaxy A55 5G</title>
  <desc id="description">Teléfono azul oscuro visto por detrás, con tres cámaras y flash.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1ff"/>
      <stop offset="1" stop-color="#e3eaf7"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8bdc6"/>
      <stop offset=".48" stop-color="#526a7a"/>
      <stop offset="1" stop-color="#293b50"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#314354"/>
      <stop offset=".5" stop-color="#c5d0d5"/>
      <stop offset="1" stop-color="#40566a"/>
    </linearGradient>
    <filter id="shadow" x="-.4" y="-.2" width="1.8" height="1.6">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="800" height="800" rx="56" fill="url(#background)"/>
